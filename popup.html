<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Time Tracker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="app-header">
    <h1>⏱️ Time Tracker</h1>
  </header>

  <!-- Tabs -->
  <nav class="tabs">
    <button class="tab-btn active" data-tab="track">Track</button>
    <button class="tab-btn" data-tab="projects">Projects</button>
    <button class="tab-btn" data-tab="history">History</button>
  </nav>

  <!-- TRACK TAB -->
  <section id="tab-track" class="tab-panel active">
    <div class="field">
      <label for="project-select">Project</label>
      <select id="project-select">
        <option value="">— Select a project —</option>
      </select>
    </div>

    <div id="timer-display" class="timer-display">00:00:00</div>

    <div id="timer-running-info" class="running-info hidden">
      Working on <strong id="running-project-name"></strong>
      <span id="running-since"></span>
    </div>

    <div class="field hidden" id="note-field">
      <label for="note-input">What did you do?</label>
      <textarea id="note-input" rows="3" placeholder="Describe the work you completed…"></textarea>
    </div>

    <div class="actions">
      <button id="start-btn" class="btn btn-primary">▶ Start</button>
      <button id="stop-btn" class="btn btn-danger hidden">■ Stop &amp; Save</button>
    </div>

    <p id="track-msg" class="msg"></p>
  </section>

  <!-- PROJECTS TAB -->
  <section id="tab-projects" class="tab-panel">
    <div class="field">
      <label for="new-project-name">New project</label>
      <div class="inline-form">
        <input type="text" id="new-project-name" placeholder="Project name" />
        <button id="add-project-btn" class="btn btn-primary">Add</button>
      </div>
    </div>
    <p id="project-msg" class="msg"></p>
    <ul id="projects-list" class="projects-list"></ul>
  </section>

  <!-- HISTORY TAB -->
  <section id="tab-history" class="tab-panel">
    <div class="field">
      <label for="history-filter">Filter by project</label>
      <select id="history-filter">
        <option value="">All projects</option>
      </select>
    </div>
    <div id="history-summary" class="history-summary"></div>
    <ul id="history-list" class="history-list"></ul>
  </section>

  <script src="popup.js"></script>
</body>
</html>
